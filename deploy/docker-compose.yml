services:
  merge:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: remnawave-subscription-merge
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - merge-data:/var/lib/remnawave-subscription-merge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  merge-data:
